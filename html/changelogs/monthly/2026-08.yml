  title: Панелька по настройки звуков
  body: "## Описание / Что этот PR делает\r\nПеределываем панельку настройки звуков\
    \ в полноценный функционал. Теперь можно под себя настроить громкость всех звуков,\
    \ какие только нашел. Помимом громкости микшер предлагает проверить громкость\
    \ на тестовых звуках. первая кнопка воспроизводит, вторая кнопка останавливает\
    \ звук.\r\n\r\n\r\n## Причина создания ПР / Почему это хорошо для игры\r\nИзначально\
    \ панелька была с одним функционалом, просто отключать полностью звук. Захотелось\
    \ сделать полноценный механизм работы микшера. Эмбиенты мертвого космоса наконец-то\
    \ можно занизить в ноль)\r\n\r\n\r\n## Демонстрация изменений / Тестирование\r\
    \nБыло:\r\n<img width=\"591\" height=\"781\" alt=\"изображение\" src=\"https://github.com/user-attachments/assets/66ba1ecd-be27-4ea6-98c9-ec9f88e0741c\"\
