- number: 12
  title: '[ADD] The voices'
  body: "## Описание PR\r\n\r\nДобавляет барк панель. Механ по баркам, только это\
    \ переназванов в голоса. В настрйоках можно отключать, включать слышимость. Это\
    \ не нейроозвучка а именно что звуками имитироваться будет речь. Выбор там звуков\
    \ большой, многое надо оттуда удалить. Настройка будет находиться в чарактере.\r\
    \n\r\nПортировано с БМ\r\n\r\n\r\n## Почему это хорошо для игры\r\nПопробуем наполнить\
    \ игру звуками вместо немых диалогов. Кому привычно читать про себя текст, могут\
    \ выключить эту опцию.\r\n\r\n\r\n## Changelog\r\n\r\n:cl:\r\nadd: голоса аля\
    \ барки при создании персонажа. По умолчанию выключены.\r\n/:cl:"
  author: MrCat15352
  merged_at: '2026-08-12'
