- number: 21
  title: '[TWEAK] Чинимся по REGEX, снижаем лимиты'
  body: "## Описание / Что этот PR делает\r\nКрайне занимательный файлик отыскал в\
    \ CI тестах, ругался на ргекс. Почитал и понял что этот файлик он обозначает лимиты.\
    \ По достижению которых повялются ошибки линтера и всякие другие. Лимиты можно\
    \ увеличить и забить фиг на эти ошибки, но лучше их починить. Не все уйдут ибо\
    \ в каких-то местах лучше юзать то что работает хорошо\r\n\r\n\r\n## Причина создания\
    \ ПР / Почему это хорошо для игры\r\nМеньше ошибок = чище код = выше производительность\r\
    \n\r\n\r\n## Демонстрация изменений / Тестирование\r\n\r\n\r\n\r\n## Список изменений"
  author: MrCat15352
  merged_at: '2026-08-06'
