  body: "## Описание / Что этот PR делает\r\nСносит весь функционал по изменению разрешения\
    \ вбюпорта для игроков на 15х15, оставляя только православные 21х15 аля широкоформат\r\
    \n\r\n\r\n## Причина создания ПР / Почему это хорошо для игры\r\n- Прошло то время\
    \ когда станция была в моде играть только на 15х15 а то и 7х7 разрешение экрана.\r\
    \n- Сложно поддерживать код механик, которые накладывают различные эффекты для\
    \ обоих разрешений, хоть и многие тупо растягиваются свои текстуры, но все же\
    \ остаются традиционные методы применения разрешения.\r\n- На широкоформатном\
    \ экране помещается больше информации, а чат справа становится не таким огромным\
    \ занимающим половину экарана\r\n\r\n\r\n## Демонстрация изменений / Тестирование\r\
    \n\r\n\r\n\r\n## Список изменений"
