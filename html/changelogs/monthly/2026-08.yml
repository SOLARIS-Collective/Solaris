- number: 30
  title: Role descriptions and notifications in ghost roles
  body: "## Описание / Что этот PR делает\r\nРефактор описаний гостролей аванпоста\
    \ элизиума\r\nУдален мертвый закомментированный код\r\n\r\n## Причина создания\
    \ ПР / Почему это хорошо для игры\r\nИзначально были сделаны изменения для того,\
    \ чтобы сократить длину ОГРОМНОГО красного текста, но в процессе обнаружились\
    \ места с силли-формулироваками, опечатками, или забытыми знаками препинания,\
    \ поэтому я расставил их по своему вкусу. Оригинальный стиль старался не трогать\r\
    \n\r\n## Демонстрация изменений / Тестирование\r\n- Немного сокращена длина ОГРОМНОГО\
    \ текста:\r\n  ```diff\r\n  - Не покидайте свой аванпост без разрешения администрации,\
    \ кроме тех случаев, когда вас силой забрали! Вы являетесь гражданином республики\
    \ Элизиум и ваш долг проявить свою гражданскую позицию!\r\n  + Не покидайте свой\
    \ аванпост собственнолично и без разрешения администрации! Как гражданин республики\
    \ Элизиум, Вы должны проявлять свою гражданскую позицию!\r\n  ```\r\n  <img width=\"\
    615\" height=\"153\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5186baec-36cd-4716-ab3b-47041f7e5f3b\"\
    \ />\r\n\r\n- Поправлена формулировка во флаворе артиста:\r\n  ```diff\r\n  -\
    \ В прошлом вы были клоуном, но сейчас настали другие времена и ваш талант, ваши\
    \ заслуги признали и сделали из вас артиста, путешествующего по разынм уголках\
    \ космоса!\r\n  + В прошлом вы были клоуном, но сейчас настали другие времена.\
    \ Ваш талант и заслуги артиста признали, и теперь вы гастролируете по разным уголках\
    \ космоса!\r\n  ```\r\n  (Пояснение: клоун - тоже артист. И \"сделали из вас артиста\"\
    \ звучит... короче, не так звучит, дёмдальш)\r\n  <img width=\"664\" height=\"\
    167\" alt=\"image\" src=\"https://github.com/user-attachments/assets/d7c55e77-4893-4074-9b77-5e3d6825a0b4\"\
    \ />\r\n\r\n- Сокращена и немного \"нормализирована\", упрощена формулировка `important_info`:\r\
    \n  ```diff\r\n  - Не покидайте свой аванпост без разрешения администрации, кроме\
    \ тех случаев, когда вас силой забрали! Вы являетесь гражданином республики Элизиум\
    \ и ваш долг проявить свою гражданскую позицию!\r\n  + Не покидайте свой аванпост\
    \ собственнолично и без разрешения администрации! Как гражданин республики Элизиум,\
    \ Вы должны проявлять свою гражданскую позицию!\r\n  ```\r\n- Предложения строк\
    \ пробуждения были разделены по смыслу, поставлена запятая перед обращением:\r\
    \n  ```diff\r\n  - Динамик в криокапсуле запиликал, извещая о том, что сон закончился,\
    \ пора вставать на работу \\the [A.name].\r\n  + Динамик в криокапсуле запиликал,\
    \ извещая о том, что сон закончился. Пора вставать на работу, \\the [A.name].\r\
    \n  ```\r\n- Исправлена дубликация вступления \"Вы - бродяга\" у роли... действительно,\
    \ у какой же роли?\r\n  ```diff\r\n  - short_desc = \"Вы бродяга...\"\r\n  - flavour_text\
    \ = \"Вы бродяга...\"\r\n  + short_desc = \"Вы - бродяга...\"\r\n  + flavour_text\
    \ = \"Только вы знаете, как вы докатились до жизни такой...\"\r\n  ```\r\n  Плюс,\
    \ исправлена противоречивая конструкция:\r\n  ```diff\r\n  - Вы бродяга. **Только\
    \ вы сами знаете как вы стали им**, <...>? **никто не скажет уже точно** [как\
    \ вы стали им]...\"\r\n  + Только вы знаете, как вы докатились до жизни такой.\
    \ Было ли это подставой, или, быть может, вы не оплатили ипотеку на судно? Вне\
    \ зависимости от причин, главное одно: нужно как-то прожить очередной день...\r\
    \n  ```\r\n  (Пояснение: в оригинальном тексте изначально написано, что \"только\
    \ вы знаете\", после чего, в следующем предложении уже \"никто не скажет точно\"\
    \ (никто не знает). Исправлено)\r\n\r\nВсе остальное лень описывать, можно и самому\
    \ глазками пройтись\r\n\r\n## Список изменений"
  author: Chi-Firka
  merged_at: '2026-08-22'
