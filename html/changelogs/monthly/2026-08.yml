- number: 20
  title: Удаляем древнее разрешение экрана 15х15
  body: "## Описание / Что этот PR делает\r\nСносит весь функционал по изменению разрешения\
    \ вбюпорта для игроков на 15х15, оставляя только православные 21х15 аля широкоформат\r\
    \n\r\n\r\n## Причина создания ПР / Почему это хорошо для игры\r\n- Прошло то время\
    \ когда станция была в моде играть только на 15х15 а то и 7х7 разрешение экрана.\r\
    \n- Сложно поддерживать код механик, которые накладывают различные эффекты для\
    \ обоих разрешений, хоть и многие тупо растягиваются свои текстуры, но все же\
    \ остаются традиционные методы применения разрешения.\r\n- На широкоформатном\
    \ экране помещается больше информации, а чат справа становится не таким огромным\
    \ занимающим половину экарана\r\n\r\n\r\n## Демонстрация изменений / Тестирование\r\
    \n\r\n\r\n\r\n## Список изменений"
  author: MrCat15352
  merged_at: '2026-08-06'
- number: 17
  title: Панелька по настройки звуков
  body: "## Описание / Что этот PR делает\r\nПеределываем панельку настройки звуков\
    \ в полноценный функционал. Теперь можно под себя настроить громкость всех звуков,\
    \ какие только нашел. Помимом громкости микшер предлагает проверить громкость\
    \ на тестовых звуках. первая кнопка воспроизводит, вторая кнопка останавливает\
    \ звук.\r\n\r\n\r\n## Причина создания ПР / Почему это хорошо для игры\r\nИзначально\
    \ панелька была с одним функционалом, просто отключать полностью звук. Захотелось\
    \ сделать полноценный механизм работы микшера. Эмбиенты мертвого космоса наконец-то\
    \ можно занизить в ноль)\r\n\r\n\r\n## Демонстрация изменений / Тестирование\r\
    \nБыло:\r\n<img width=\"591\" height=\"781\" alt=\"изображение\" src=\"https://github.com/user-attachments/assets/66ba1ecd-be27-4ea6-98c9-ec9f88e0741c\"\
    \ />\r\n\r\nСтало:\r\n<img width=\"841\" height=\"779\" alt=\"изображение\" src=\"\
    https://github.com/user-attachments/assets/26096857-1d77-40eb-8588-2b0aee5eceb4\"\
    \ />\r\n\r\n\r\n\r\n## Список изменений"
  author: MrCat15352
  merged_at: '2026-08-06'
