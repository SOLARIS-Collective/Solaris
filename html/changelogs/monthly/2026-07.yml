- number: 7
  title: Исправлены стили скролбаров
  body: "## Описание PR\r\nИзменил способ формирования стилей у стат панели, чата,\
    \ настроек чата, сами окна везде где используются скролбары. С переходом на хромиум\
    \ многие элементы перестали поддерживаться от IE, пришлось все чинить с переходом\
    \ на 516 версию.\r\n\r\n## Почему это хорошо для игры\r\nМеьше визуальных багов,\
    \ в глаза резались эти все белые стрелки и кнопки.\r\nБыло:\r\n<img width=\"215\"\
    \ height=\"943\" alt=\"изображение\" src=\"https://github.com/user-attachments/assets/daa292a4-6eb7-498e-a599-9421f1f2f027\"\
    \ />\r\n\r\nСтало:\r\n<img width=\"106\" height=\"830\" alt=\"изображение\" src=\"\
    https://github.com/user-attachments/assets/15041dbb-eb11-42b5-9337-b0a7c5f75241\"\
    \ />\r\n\r\n\r\n## Changelog\r\n\r\n:cl:\r\ncode: Изменён код стилей, тгуи, html,\
    \ scss добавлена поддержка вебкитов совместно со старыми методами, ибо стат панель\
    \ работает от бьонд движка.\r\n/:cl:"
  author: MrCat15352
  merged_at: '2026-07-21'
