'👮‍♂️ Админ':
  - any-glob-to-any-file:
    - 'code/modules/admin/**'

'📌 Зависимости':
- changed-files:
  - any-glob-to-any-file:
    - '**/package.json'
    - '**/package-lock.json'
    - '**/yarn.lock'

# When the .DME is changed
'🗃 DME Edit':
- changed-files:
  - any-glob-to-any-file:
    - './*.dme'
    - '**/*.dme'

# Any .dmi changes
'🎨 Спрайты':
- changed-files:
  - any-glob-to-any-file:
    - '**/*.dmi'

# Changes to a .dm or anything in the code subfolder
'🧱 Код':
- changed-files:
  - any-glob-to-any-file:
    - '**/*.dm'
    - 'code/**'

# Changes to a .dmm or anything in the _map subfolder
'🗺 Маппинг':
- changed-files:
  - any-glob-to-any-file:
    - '**/*.dmm'
    - '_maps/**'

'🚀 Корабли':
- changed-files:
  - any-glob-to-any-file:
    - '_maps/shuttles/**'
    - '_maps/configs/**'
    - '_maps/_modular_solaris/shuttles/**'
    - '_maps/_modular_solaris/configs/**'

'🏔 Руинки':
- changed-files:
  - any-glob-to-any-file:
    - '_maps/RandomRuins/**'
    - 'code/datums/ruins/**'
    - '_maps/_modular_solaris/RandomRuins/**'

# Any changes to .ogg files are marked as sound
'🔊 Звуки':
- changed-files:
  - any-glob-to-any-file:
    - '**/*.aif'
    - '**/*.aiff'
    - '**/*.it'
    - '**/*.mid'
    - '**/*.midi'
    - '**/*.mod'
    - '**/*.mp3'
    - '**/*.ogg'
    - '**/*.oxm'
    - '**/*.raw'
    - '**/*.s3m'
    - '**/*.wma'
    - '**/*.wav'
    - '**/*.xm'

# Changes to the SQL subfolder
'📚 SQL':
- changed-files:
  - any-glob-to-any-file:
    - 'SQL/**'

# Changes to the tgui subfolder
'💬 TGUI':
- changed-files:
  - any-glob-to-any-file:
    - 'tgui/**'

# Changes to the config subfolder
'🔮 Конфиги':
- changed-files:
  - any-glob-to-any-file:
    - 'config/**/*'
    - 'config/example/**/*'

# Changes to the .Github subfolder
'🏭 Github':
- changed-files:
  - any-glob-to-any-file:
    - '.github/**'
    - '.github/**/*'
    - '.vscode/**/*'
    - 'docs/**/*'
    - 'scripts/**/*'
    - 'test/**/*'
    - 'tools/**/*'
    - '.codebeatignore'
    - '.codebeatsettings'
    - '.editorconfig'
    - '.git*'
    - '.gitignore'
    - 'biome.json'
    - 'libmysql.dll'
    - 'LICENSE'
    - 'README.md'
    - 'SpacemanDMM.toml'

'SOL':
- changed-files:
  - any-glob-to-any-file:
    - 'modular_solaris/*'
    - 'code/__DEFINES/~modular_solaris/*'

'PEN':
- changed-files:
  - any-glob-to-any-file:
    - 'modular_pentest/*'
    - 'code/~PENTEST/*'

'MND':
- changed-files:
  - any-glob-to-any-file:
    - 'modular_mankind/*'
    - 'code/__DEFINES/~modular_mankind/*'
