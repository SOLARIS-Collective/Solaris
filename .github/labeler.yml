'👮‍♂️ Админ':
  - any-glob-to-any-file:
    - "code/modules/admin/**"

# Any file within the config subfolder
'🔮 Конфиги':
- changed-files:
  - any-glob-to-any-file:
    - "config/**"

'📌 Зависимости':
- changed-files:
  - any-glob-to-any-file:
    - "**/package.json"
    - "**/package-lock.json"
    - "**/yarn.lock"

# When the .DME is changed
'🗃 DME Edit':
- changed-files:
  - any-glob-to-any-file:
    - "./*.dme"
    - "**/*.dme"

# Any .dmi changes
'🎨 Спрайты':
- changed-files:
  - any-glob-to-any-file:
    - "**/*.dmi"

# Changes to a .dm or anything in the code subfolder
'🧱 Код':
- changed-files:
  - any-glob-to-any-file:
    - "**/*.dm"
    - "code/**"

# Changes to a .dmm or anything in the _map subfolder
'🗺 Маппинг':
- changed-files:
  - any-glob-to-any-file:
    - "**/*.dmm"
    - "_maps/**"

'🚀 Корабли':
- changed-files:
  - any-glob-to-any-file:
    - "_maps/shuttles/**"
    - "_maps/configs/**"

'🏔 Руинки':
- changed-files:
  - any-glob-to-any-file:
    - "_maps/RandomRuins/**"
    - "code/datums/ruins/**"

# Any changes to .ogg files are marked as sound
'🔊 Звуки':
- changed-files:
  - any-glob-to-any-file:
    - "**/*.ogg"

# Changes to the SQL subfolder
'📚 SQL':
- changed-files:
  - any-glob-to-any-file:
    - "SQL/**"

# Changes to the tgui subfolder
'💬 TGUI':
- changed-files:
  - any-glob-to-any-file:
    - "tgui/**"

# Changes to the .Github subfolder
'🏭 Github':
- changed-files:
  - any-glob-to-any-file:
    - ".github/**"
