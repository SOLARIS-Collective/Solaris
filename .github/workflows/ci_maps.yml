name: Сборка и Компиляция Карт
on:
  push:
    branches: [master]
    paths:
      - '_maps/**'
  pull_request:
    branches: [master]
    paths:
      - '_maps/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_all_maps:
    name: Compile Maps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Stub private module
        run: |
          mkdir -p modular_solaris/_omni_access/code/overrides
          printf '// Приватный модуль исключён из CI-сборки\n' > modular_solaris/_omni_access/__private.dme
          cp code/controllers/subsystem/overmap.dm modular_solaris/_omni_access/code/overrides/overmap.dm
          cp code/datums/mapgen/planetary/_PlanetGenerator.dm modular_solaris/_omni_access/code/overrides/_PlanetGenerator.dm
          cp code/modules/admin/verbs/randomverbs.dm modular_solaris/_omni_access/code/overrides/randomverbs.dm
          cp code/modules/overmap/objects/dynamic_datum.dm modular_solaris/_omni_access/code/overrides/dynamic_datum.dm

      - name: Setup cache
        id: cache-byond
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: ${{ runner.os }}-byond-cache-${{ secrets.CACHE_PURGE_KEY }}-${{ hashFiles('dependencies.sh') }}-${{ hashFiles('.github/workflows/ci_suite.yml') }}
      - name: Install BYOND
        if: steps.cache-byond.outputs.cache-hit != 'true'
        run: bash tools/ci/install_byond.sh

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libcurl4:i386

      - name: Compile All Maps
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/build/build --ci dm -DCIBUILDING -DCITESTING -DALL_MAPS -DFULL_INIT
