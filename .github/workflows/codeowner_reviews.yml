name: Codeowner Reviews

# Controls when the workflow will run
on: pull_request_target

permissions:
  pull-requests: write
  contents: read

jobs:
  assign-users:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v4

      #Parse the Codeowner file
      - name: CodeOwnersParser
        id: CodeOwnersParser
        uses: tgstation/CodeOwnersParser@v1

      #Trim trailing whitespace from owners list
      - name: Trim owners
        id: trim
        run: echo "owners=$(echo '${{ steps.CodeOwnersParser.outputs.owners }}' | xargs)" >> $GITHUB_OUTPUT

      #Request reviews
      - name: Request reviews
        if: steps.trim.outputs.owners != ''
        uses: tgstation/RequestReviewFromUser@v1
        with:
          separator: ' '
          users: ${{ steps.trim.outputs.owners }}
